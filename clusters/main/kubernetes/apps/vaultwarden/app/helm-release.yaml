---
# yaml-language-server: schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 15m
  chart:
    spec:
      chart: vaultwarden
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    resources:
      requests:
        cpu: 10m
    TZ: America/Chicago
    credentials:
      s3:
        type: s3
        url: "${MINIO_S3URL}"
        bucket: "${MINIO_S3PREFIX}-vault"
        accessKey: "${MINIO_S3ID}"
        secretKey: "${MINIO_S3KEY}"
        encrKey: "${MINIO_S3KEY}"       
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: vault.${DOMAIN_1}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    vaultwarden:
        allowSignups: false
        verifySignup: false
        requireEmail: false
        allowInvitation: true
        showPasswordHint: false
        enableWebVault: true
        admin:
          enabled: true
          disableAdminToken: false
          token: ${VW_TOKEN}
        smtp:
          enabled: true
          host: ${VAULT_SMTP}
          from: ${DOMAIN_1_EMAIL}
          fromName: MooneyDude
          security: starttls
          port: 587
          heloName: Vaultwarden
          timeout: 15
          invalidHostname: false
          invalidCertificate: false
          user: ${DOMAIN_1_EMAIL}
          password: ${VAULT_SMTP_PWD}          
    persistence:
      data:
        size: 10Gi
        volsync:
          - name: data
            type: restic
            credentials: s3
            src:
              volumeSnapshotClassName: csi-ceph-blockpool               
              enabled: true
              trigger:
                schedule: "0 0 * * *"  
            dest:
              volumeSnapshotClassName: csi-ceph-blockpool               
              enabled: true
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: vaultwarden
          postgresqlDatabase: vaultwarden
        operator:
          mode: recovery
          backups:
            enabled: true
            credentials: s3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 0 0 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: "7d"
            revision: "5"
          recovery:
            method: object_store
            credentials: s3
            revision: "5"
    workload:
      main:
        # type: Deployment
        # strategy: RollingUpdate
        # replicas: 2      
        podSpec:
          containers:
            main:
              envFrom:
                - configMapRef:
                    name: vaultwardenconfig
                - secretRef:
                    name: vaultwardensecret          
