---
# Fizz agent-host — always-on buzz-acp harness (+ buzz-agent brain + buzz CLI),
# deployed BESIDE the relay HelmRelease as a plain Deployment (like redis.yaml),
# in apps/buzz/app/. One Deployment per identity; replicas:1 + Recreate so two
# Fizz hosts never overlap (= double replies).
#
# Option A: sole Fizz host — chat/ops + talos GitOps + git-mediated Rocket dev.
# ⚠️ Fizz must NEVER push talos-cluster `main` (Flux tracks it → push = deploy).
# Branch + let the owner merge. rocket-life: feature branches only.
#
# Image lives in the self-hosted registry (docker.${DOMAIN_1}) — same anonymous-
# pull pattern as apps/xepg (no imagePullSecret needed).
#
# Secrets come from clusterenv (${...}) via Flux substituteFrom cluster-config —
# owner adds CLAUDE_CODE_OAUTH_TOKEN, HIVE_NSEC, GITHUB_TOKEN to
# clusters/main/clusterenv.yaml. clusterenv is SOPS-encrypted at rest (.sops.yaml),
# but NOTE: like MINIO_S3KEY today, these render as plaintext in the in-cluster
# cluster-config ConfigMap + this Deployment's env. If you'd rather HIVE_NSEC /
# GITHUB_TOKEN be k8s Secrets (secretKeyRef) instead, say so — easy swap.
#
# ANTHROPIC_KEY and FIZZ_NSEC are no longer read by this Deployment: the brain
# moved to Claude Code on the owner's subscription, and this pod now has its own
# identity (Hive) rather than sharing Fizz's key with Buzz Desktop.
#
# Add to apps/buzz/app/kustomization.yaml resources:
#   - ./fizz-agent-pvc.yaml
#   - ./fizz-agent.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fizz-agent
  namespace: buzz
  labels:
    app.kubernetes.io/name: fizz-agent
spec:
  # OFF as of 2026-07-26: pay-as-you-go API spend was not economical (~$8 for one
  # debugging session, most of it duplicated by Desktop-Fizz answering the same
  # mentions). Flux reverts a bare `kubectl scale`, so the off switch has to live
  # here. Set back to 1 after the move to Claude Code / Max-plan auth.
  replicas: 0
  strategy:
    type: Recreate                         # RWO PVC + one-host-per-identity
  selector:
    matchLabels:
      app.kubernetes.io/name: fizz-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fizz-agent
    spec:
      # The relay binds each WS connection to a community by the request Host
      # (an in-cluster svc name → 404). So Fizz connects to the PUBLIC relay
      # host; hostAliases points that host at the internal ingress LB
      # (${NGINX_INTERNAL_IP}) so traffic stays on-cluster with the right Host
      # + valid TLS — same path the Desktop client uses.
      hostAliases:
        - ip: "${NGINX_INTERNAL_IP}"
          hostnames:
            - "buzz.${DOMAIN_1}"
      nodeSelector:
        kubernetes.io/arch: amd64          # image is linux/amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                    # image creates uid/gid 1000 "buzz"
        runAsGroup: 1000
        fsGroup: 1000                      # so uid 1000 can write the PVC
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nest
          persistentVolumeClaim:
            claimName: fizz-agent-nest
      containers:
        - name: agent-host
          image: docker.${DOMAIN_1}/buzz-agent-host:prod-0.3
          imagePullPolicy: Always          # :prod is a moving channel tag
          workingDir: /var/lib/buzz        # the nest; REPOS is created here (real dir → clone-on-demand)
          volumeMounts:
            - name: nest
              mountPath: /var/lib/buzz     # persist clones + OUTBOX + scratch (engram memory is relay-side)
          env:
            # ── buzz-acp : relay harness ───────────────────────────────────
            # Public relay host (NOT the in-cluster svc — the relay is
            # multi-tenant and 404s any host that isn't a mapped community).
            # hostAliases (above) keeps this on-cluster via the internal ingress.
            - name: BUZZ_RELAY_URL
              value: "wss://buzz.${DOMAIN_1}"
            # The brain. claude-agent-acp drives the Claude Code CLI, which
            # authenticates against the owner's Claude subscription — not a
            # metered API key. This is the same brain Buzz Desktop has always
            # run (ps: buzz-acp → node .../node-tools/bin/claude-agent-acp).
            # buzz-agent is still in the image as an API-key fallback.
            # Requires >= prod-0.3 (node + @agentclientprotocol/claude-agent-acp).
            - name: BUZZ_ACP_AGENT_COMMAND
              value: "claude-agent-acp"
            - name: BUZZ_ACP_AGENT_ARGS
              value: ""
            - name: BUZZ_ACP_AGENTS
              value: "2"
            - name: BUZZ_ACP_RESPOND_TO
              value: "owner-only"
            # Owner pubkey (public hex) — REQUIRED for the owner-only gate, else
            # buzz-acp resolves no owner and drops every event. (Same value as
            # the relay's RELAY_OWNER_PUBKEY.)
            - name: BUZZ_ACP_AGENT_OWNER
              value: "1d17ef66780c2ffceaa4249490e9ec8f3d2084bf4928c21c0c8ac089f4aa77b0"
            # buzz-agent's ONLY built-in tool is load_skill. Shell, file r/w, rg,
            # tree, todo — and therefore any ability to run the `buzz` CLI and
            # post a reply — all arrive over MCP from the buzz-dev-mcp sidecar.
            # Desktop sets this automatically for the buzz-agent runtime
            # (desktop/.../managed_agents/discovery.rs → mcp_command:
            # Some("buzz-dev-mcp")); a Deployment has to say it out loud.
            # Without it the agent receives mentions, thinks, and cannot speak:
            # turns end outcome="ok" having published nothing. Requires the
            # buzz-dev-mcp binary in the image (>= prod-0.2).
            - name: BUZZ_ACP_MCP_COMMAND
              value: "buzz-dev-mcp"
            # Enables the MCP hook tools (_Stop, _PostCompact). The buzz-agent
            # runtime entry sets mcp_hooks: true; "*" matches because the server
            # name is hard-coded to "buzz-mcp".
            - name: MCP_HOOK_SERVERS
              value: "*"
            # The agent's persona. Without this, config.system_prompt is None and
            # buzz-agent falls back to its own generic default — the compiled-in
            # [Base] harness prompt (buzz-acp/src/base_prompt.md, include_str!) is
            # always present, but there is no "you are Fizz" block at all. Desktop
            # sends this automatically from the saved agent definition; a
            # Deployment has to say it out loud. Suspected cause of cold-session
            # turns that make zero tool calls and publish nothing.
            # NOTE: no `$` anywhere in this value — Flux envsubst runs over it.
            - name: BUZZ_ACP_SYSTEM_PROMPT
              value: |-
                You are Hive, an energetic maker agent who turns ideas into
                action. Be upbeat, practical, and decisive. Help the owner plan,
                create, solve problems, and finish work. Add occasional bee
                wordplay or 🐝✨ — keep it charming, never distracting.

                You are the always-on agent, running as the fizz-agent pod in the
                owner's Talos cluster (namespace buzz, working directory
                /var/lib/buzz). You exist so mentions still get answered when the
                owner's MacBook is asleep. You are usually reached from mobile.

                You have no kubectl, no kubeconfig, no cluster admin access, and
                no checkouts of the owner's git repositories. Do not offer to run
                kubectl, inspect cluster state, edit manifests, or work in a repo.

                Fizzman is the same maker persona on the owner's MacBook, with
                kubectl, the repos, and the local dev environment. Anything
                needing cluster access, repository work, or builds goes to
                Fizzman — say so plainly rather than guessing. You and Fizzman
                are separate agents with separate identities and separate
                memory; never claim to be Fizzman or speak for them.
            # ── brain → LLM ────────────────────────────────────────────────
            # Read by the Claude Agent SDK that claude-agent-acp wraps. Sonnet 5
            # rather than Opus: this agent answers mobile questions, and the
            # subscription's limits are shared with the owner's own interactive
            # Claude Code on the Mac.
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-5"
            # ── secrets via clusterenv (${...} → Flux substituteFrom cluster-config) ──
            # Long-lived subscription token from `claude setup-token`, NOT an API
            # key. This is what takes the pod off metered pay-as-you-go billing.
            # Owner adds CLAUDE_CODE_OAUTH_TOKEN to clusterenv.yaml (SOPS-encrypted).
            # ⚠️ Do not add this Deployment back to git referencing a clusterenv
            # key that does not exist yet — an unresolved substitution fails the
            # whole `buzz` Kustomization, taking buzz-app-template and buzz-redis
            # down with it.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              value: "${CLAUDE_CODE_OAUTH_TOKEN}"
            # Hive's OWN nsec — deliberately not FIZZ_NSEC. Sharing one key with
            # Desktop meant every mention matched both hosts (the relay mention
            # filter is #p:[pubkey], buzz-acp/src/relay.rs:3182), so both answered
            # and both billed. Renaming could never fix that; only a second key.
            - name: BUZZ_PRIVATE_KEY
              value: "${HIVE_NSEC}"           # owner adds HIVE_NSEC to clusterenv.yaml
            # ── git auth (Option A): token baked into the HTTPS rewrite ────
            # Flux substitutes ${GITHUB_TOKEN} at reconcile; git then clones the
            # repos' git@github.com: remotes over authenticated HTTPS. No shell
            # $VARs here (they'd collide with Flux envsubst), no SSH keys.
            - name: GIT_CONFIG_COUNT
              value: "3"
            - name: GIT_CONFIG_KEY_0
              value: "user.name"
            - name: GIT_CONFIG_VALUE_0
              value: "Fizz"                   # CONFIRM commit attribution
            - name: GIT_CONFIG_KEY_1
              value: "user.email"
            - name: GIT_CONFIG_VALUE_1
              value: "fizz@mooneybin.net"     # CONFIRM
            - name: GIT_CONFIG_KEY_2
              value: "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf"
              # ^ owner adds GITHUB_TOKEN to clusterenv.yaml (fine-grained PAT)
            - name: GIT_CONFIG_VALUE_2
              value: "git@github.com:"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false    # buzz-acp writes logs + spawns subprocesses
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
