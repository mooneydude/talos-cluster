---
# yaml-language-server: schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: joplin-server
  namespace: joplin-server
spec:
  interval: 15m
  chart:
    spec:
      chart: joplin-server
      version: 24.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 60m
  maxHistory: 3
  install:
    createNamespace: true
    disableWait: true # don't block on Deployment readiness
    remediation:
      retries: 0 # no uninstall-on-failure
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 0
  uninstall:
    keepHistory: false

  values:
    global:
      stopAll: false
    credentials:
      s3:
        type: s3
        url: "${MINIO_S3URL}"
        bucket: "${MINIO_S3PREFIX}-joplin"
        accessKey: "${MINIO_S3ID}"
        secretKey: "${MINIO_S3KEY}"
        encrKey: "${MINIO_S3KEY}"
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${JOPLIN_IP}
        integrations:
          metallb:
            enabled: true
        ports:
          main:
            port: 22300
            targetPort: 22300
            protocol: tcp
    secret:
      env-secrets:
        enabled: true
        data:
          MAILER_AUTH_PASSWORD: ${VAULT_SMTP_PWD}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: joplin.${DOMAIN_1}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    persistence:
      config:
        size: 1Gi
        volsync:
          - name: config
            type: restic
            credentials: s3
            src:
              volumeSnapshotClassName: csi-ceph-blockpool
              enabled: true
              trigger:
                schedule: "0 0 * * *"
            dest:
              volumeSnapshotClassName: csi-ceph-blockpool
              enabled: true
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: joplin
          postgresqlDatabase: joplin
        operator:
          mode: recovery
          backups:
            enabled: true
            credentials: s3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 0 0 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: "7d"
            revision: "2"
          recovery:
            method: object_store
            credentials: s3
            revision: "2"
      valkey:
        enabled: false
    workload:
      main:
        # type: Deployment
        # strategy: RollingUpdate
        # replicas: 2
        podSpec:
          containers:
            main:
              env:
                APP_BASE_URL: "https://{{ if .Values.ingress }}{{ if .Values.ingress.main.enabled }}{{ ( index .Values.ingress.main.hosts 0 ).host }}{{ else }}placeholder.com{{ end }}{{ else }}placeholder.com{{ end }}"
                APP_PORT: "{{ .Values.service.main.ports.main.port }}"
                USER_CONTENT_BASE_URL: "https://joplin.${DOMAIN_1}"
                MAILER_ENABLED: 1
                MAILER_HOST: ${VAULT_SMTP}
                MAILER_PORT: 587
                MAILER_SECURITY: starttls
                MAILER_AUTH_USER: ${VAULT_SMTP_USER}
                MAILER_NOREPLY_NAME: MooneyDude
                MAILER_NOREPLY_EMAIL: ${VAULT_SMTP_USER}
