---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: listenarr
  namespace: listenarr
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 15.38.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
        url: "${MINIO_S3URL}"
        bucket: "${MINIO_S3PREFIX}-listenarr"
        accessKey: "${MINIO_S3ID}"
        secretKey: "${MINIO_S3KEY}"
        encrKey: "${MINIO_S3KEY}"         
    image:
      repository: docker.io/therobbiedavis/listenarr
      tag: canary
      pullPolicy: Always
    securityContext:
      container:
        runAsUser: 3000
        runAsGroup: 3000
    service:
      main:
        ports:
          main:
            port: 5000
            targetPort: 5000
            protocol: http
    persistence:
      config:
        enabled: true
        mountPath: /app/config
        storageClass: ceph-filesystem
        size: 1Gi
        accessModes:
          - ReadWriteMany       
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true                        
            src:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
              trigger:
                schedule: 0 3 * * *               
      audiobooks:
        enabled: true
        path: "/mnt/bigdata/plex/Audio Books"
        mountPath: /audiobooks
        server: ${TRUENAS_IP}
        type: nfs    
      downloads:
        enabled: true
        path: /mnt/bigdata/plex/Downloads/Completed
        mountPath: /media/downloads/completed
        server: ${TRUENAS_IP}
        type: nfs                              
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: listenarr.${DOMAIN_1}
            paths:
            - path: /
              pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    workload:
      main:
        podSpec:
          securityContext:
            fsGroup: 3000
          containers:
            main:
              env:
                URLS: "http://*:5000"
