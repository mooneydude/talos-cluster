---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: listenarr
  namespace: listenarr
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 15.38.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    image:
      repository: docker.io/therobbiedavis/listenarr
      tag: canary
      pullPolicy: Always
    service:
      main:
        ports:
          main:
            port: 5000
            targetPort: 5000
            protocol: http
    persistence:
      config:
        enabled: true
        mountPath: /app/config
        storageClass: ceph-filesystem
        size: 1Gi
        accessModes:
          - ReadWriteMany
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: listenarr.${DOMAIN_1}
            paths:
            - path: /
              pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
