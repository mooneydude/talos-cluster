---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 15m
  chart:
    spec:
      chart: homepage
      version: 12.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    forceConfigFromValues: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                HOMEPAGE_ALLOWED_HOSTS: "home.${DOMAIN_1}"
    persistence:
      config:
        storageClass: ceph-filesystem
        size: 1Gi
        accessModes:
          - ReadWriteMany
    configmap:
      config:
        data:
          services.yaml: |
            ---
            - Media:
                - Sonarr:
                    href: https://sonarr.${DOMAIN_1}
                    description: TV show automation
                - Radarr:
                    href: https://radarr.${DOMAIN_1}
                    description: Movie automation
                - Prowlarr:
                    href: https://prowlarr.${DOMAIN_1}
                    description: Indexer manager
                    widget:
                      type: prowlarr
                      url: http://prowlarr.prowlarr.svc.cluster.local:9696
                      key: ${PROWLARR_API_KEY}
                - RDT-Client:
                    href: https://rdtclient.${DOMAIN_1}
                    description: Real-Debrid download client
                    siteMonitor: https://real-debrid.com
                - RDT-Client (TorBox):
                    href: https://rdtclient-torbox.${DOMAIN_1}
                    description: TorBox download client
                    siteMonitor: https://torbox.app
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: home.${DOMAIN_1}
            paths:
            - path: /
              pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
