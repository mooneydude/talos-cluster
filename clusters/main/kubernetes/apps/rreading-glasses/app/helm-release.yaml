---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rreading-glasses
  namespace: rreading-glasses
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 15.38.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    # Self-hosted metadata backend for bookshelf (Hardcover flavor, matching
    # bookshelf's own :hardcover image tag so foreignAuthorId/foreignBookId
    # schemes line up with what's already in the library). Only avoids the
    # rate limits of the public hardcover.bookinfo.pro instance - not a
    # library manager or downloader itself.
    image:
      repository: blampe/rreading-glasses
      tag: hardcover
      pullPolicy: Always
    cnpg:
      main:
        enabled: true
        database: rreading-glasses
        user: rreading-glasses
    service:
      main:
        ports:
          main:
            port: 8788
            targetPort: 8788
            protocol: http
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              command:
                - /main
                - serve
                - --verbose
              env:
                HARDCOVER_AUTH: "${HARDCOVER_AUTH}"
                POSTGRES_HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                POSTGRES_DATABASE: rreading-glasses
                POSTGRES_USER:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: username
                POSTGRES_PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: rreading-glasses.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
