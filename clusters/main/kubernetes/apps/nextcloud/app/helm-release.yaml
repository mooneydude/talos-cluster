apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 50.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
        url: "${MINIO_S3URL}"
        bucket: "${MINIO_S3PREFIX}-nextcloud"
        accessKey: "${MINIO_S3ID}"
        secretKey: "${MINIO_S3KEY}"
        encrKey: "${MINIO_S3KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: cloud.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    persistence:
      config:
        storageClass: ceph-filesystem
        size: 1Gi
        accessModes:
          - ReadWriteMany
        volsync:
          - name: config
            type: restic
            credentials: s3
            dest:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
            src:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
              trigger:
                schedule: 30 7 * * *
      html:
        storageClass: ceph-filesystem
        size: 10Gi
        accessModes:
          - ReadWriteMany
        volsync:
          - name: html
            type: restic
            credentials: s3
            copyMethod: Direct
            dest:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
            src:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
              trigger:
                schedule: 0 8 * * *
      data:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/data1/nc_userdata
      # Holds /var/log/nextcloud, mounted by the main pod AND both cron jobs.
      # It must be ReadWriteMany: with the chart default (ReadWriteOnce on the
      # cluster default ceph-nvme class) the cron Jobs cannot attach the volume
      # unless they happen to land on the same node as the main pod, and they
      # then sit in ContainerCreating with
      # "FailedAttachVolume ... Volume is already used by pod(s) nextcloud-...".
      logs:
        storageClass: ceph-filesystem
        size: 2Gi
        accessModes:
          - ReadWriteMany
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: nextcloud
          postgresqlDatabase: nextcloud
        operator:
          backups:
            enabled: true
            credentials: s3
            scheduledBackups:
              - name: daily-backup
                schedule: "0 45 7 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
            retentionPolicy: "7d"
            revision: "1"          # keeps serverName nextcloud-cnpg-main-r1
          recovery:
            method: object_store
            credentials: s3
            revision: ""
      valkey:
        enabled: true
        mode: operator
        operator:
          # replicas = replicas per shard (1 primary + 1 replica)
          replicas: 1
          persistence:
            enabled: true
            size: 5Gi
            storageClass: ceph-nvme
          scheduling:
            node:
              spread:
                shard:
                  mode: Required
    nextcloud:
      credentials:
        initialAdminPassword: ${NEXTCLOUD_PWD}
        initialAdminUser: ${NEXTCLOUD_USER}
      general:
        accessIP: ${NGINX_EXTERNAL_IP}
        default_phone_region: US
      previews:
        providers:
          - BMP
          - GIF
          - JPEG
          - Krita
          - MarkDown
          - MP3
          - OpenDocument
          - PNG
          - TXT
          - XBitmap
    podOptions:
      defaultAffinity: false
    workload:
      main:
        type: Deployment
        strategy: RollingUpdate
        replicas: 2
        podSpec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: nextcloud
                      pod.name: main
                  topologyKey: kubernetes.io/hostname
      nginx:
        type: Deployment
        strategy: RollingUpdate
        replicas: 2
        podSpec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: nextcloud
                      pod.name: nginx
                  topologyKey: kubernetes.io/hostname
