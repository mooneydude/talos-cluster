---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rdtclient-torbox
  namespace: rdtclient-torbox
spec:
  interval: 15m
  chart:
    spec:
      chart: rdtclient
      version: 8.10.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    aria2:
      rpc_secret: mysecret123
    # Tune aria2's NFS write behaviour. Without this, aria2 preallocates the
    # file and writes small unaligned chunks, which makes the NFS client do a
    # read-modify-write per page. aria2 is single-threaded, so it stalls on
    # those NFS reads and download speed collapses (~20-30 MiB/s vs ~120 MB/s).
    # These settings live in /config/aria2.conf on the config PVC, which the
    # image only generates when missing, so we patch it before /init runs.
    workload:
      aria2:
        podSpec:
          containers:
            aria2:
              command:
                - /bin/bash
                - -c
                - |
                  conf=/config/aria2.conf
                  if [ -f "$conf" ]; then
                    sed -i -E \
                      -e 's@^[[:space:]]*#?[[:space:]]*split[[:space:]]*=.*@split=1@' \
                      -e 's@^[[:space:]]*#?[[:space:]]*max-connection-per-server[[:space:]]*=.*@max-connection-per-server=1@' \
                      -e 's@^[[:space:]]*#?[[:space:]]*file-allocation[[:space:]]*=.*@file-allocation=none@' \
                      "$conf"
                    grep -q '^split=' "$conf" || echo 'split=1' >> "$conf"
                    grep -q '^max-connection-per-server=' "$conf" || echo 'max-connection-per-server=1' >> "$conf"
                    grep -q '^file-allocation=' "$conf" || echo 'file-allocation=none' >> "$conf"
                  fi
                  exec /init
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
        url: "${MINIO_S3URL}"
        bucket: "${MINIO_S3PREFIX}-rdtclient-torbox"
        accessKey: "${MINIO_S3ID}"
        secretKey: "${MINIO_S3KEY}"
        encrKey: "${MINIO_S3KEY}"
    persistence:
      config:
        storageClass: ceph-filesystem
        size: 1Gi
        accessModes:
          - ReadWriteMany
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
            src:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
              trigger:
                schedule: 0 3 * * *
      mediacompleted:
        enabled: true
        path: /mnt/bigdata/plex/Downloads/Completed
        mountPath: /media/downloads/completed
        server: ${TRUENAS_IP}
        type: nfs
        targetSelectAll: true
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: rdtclient-torbox.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
