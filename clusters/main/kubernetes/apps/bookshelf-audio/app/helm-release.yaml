---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookshelf-audio
  namespace: bookshelf-audio
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 15.38.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
        url: "${MINIO_S3URL}"
        bucket: "${MINIO_S3PREFIX}-bookshelf-audio"
        accessKey: "${MINIO_S3ID}"
        secretKey: "${MINIO_S3KEY}"
        encrKey: "${MINIO_S3KEY}"
    # Second, audio-only bookshelf instance - split from the main (ebook)
    # bookshelf so an audiobook grab and an ebook grab for the same title
    # never share a book record. See bookshelf/app/helm-release.yaml for
    # the sibling ebook-only instance and the LSIO root/PUID rationale.
    image:
      repository: ghcr.io/pennydreadful/bookshelf
      tag: hardcover
      pullPolicy: Always
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        ports:
          main:
            port: 8787
            targetPort: 8787
            protocol: http
    persistence:
      config:
        enabled: true
        mountPath: /config
        storageClass: ceph-filesystem
        size: 1Gi
        accessModes:
          - ReadWriteMany
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
            src:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
              trigger:
                schedule: 0 3 * * *
      audiobooks:
        enabled: true
        path: "/mnt/bigdata/plex/Audio Books"
        mountPath: /audiobooks
        server: ${TRUENAS_IP}
        type: nfs
      downloads:
        enabled: true
        path: /mnt/bigdata/plex/Downloads/Completed
        mountPath: /media/downloads/completed
        server: ${TRUENAS_IP}
        type: nfs
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: bookshelf-audio.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            certificateIssuer: domain-0-le-prod
            enabled: true
    # No manual PUID/PGID: app-template derives those itself from
    # securityContext.container.runAsUser/runAsGroup above as chart-managed
    # env vars, and errors if you also set them by hand (fixedEnv conflict).
