apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kavita
    namespace: kavita
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=https://charts.truechartsoci.org
            chart: kavita
            version: 13.7.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    timeout: 20m
    values:
      TZ: America/Chicago
      resources:
        requests:
          cpu: 10m         
      portal:
        open:
          enabled: false
      global:
        stopAll: false
      credentials:
        s3:
          type: s3
          url: "${MINIO_S3URL}"
          bucket: "${MINIO_S3PREFIX}-kavita"
          accessKey: "${MINIO_S3ID}"
          secretKey: "${MINIO_S3KEY}"
          encrKey: "${MINIO_S3KEY}"
      ingress:
        main:
          enabled: true
          ingressClassName: external
          hosts:
            - host: read.${DOMAIN_1}
          integrations:
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod  
      persistence:
        config:
          storageClass: ceph-filesystem
          size: 10Gi
          accessModes:
            - ReadWriteMany           
          volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              volumeSnapshotClassName: ceph-filesystem
              enabled: false # dataSourceRef is immutable on an existing bound PVC; toggling this back to true
                             # requires deleting/recreating kavita-config, otherwise Helm upgrades fail
            src:
              volumeSnapshotClassName: ceph-filesystem
              enabled: true
        manga:
          type: nfs
          server: ${TRUENAS_IP}
          path: "/mnt/bigdata/plex/Books"
