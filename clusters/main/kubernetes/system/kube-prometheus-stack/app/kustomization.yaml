---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-release.yaml
  - alertmanagerconfig.yaml
  - pfsense-scrapeconfig.yaml
configMapGenerator:
  - name: homelab-mission-control-dashboard
    namespace: kube-prometheus-stack
    files:
      - homelab-mission-control.json=dashboards/homelab-mission-control.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
