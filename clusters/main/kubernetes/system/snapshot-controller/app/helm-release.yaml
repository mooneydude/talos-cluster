apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 5m
  chart:
    spec:
      chart: snapshot-controller
      version: 7.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Skip: chart 7.0.1 ships the group-snapshot CRDs with only v1beta1, but the
    # live CRDs report storedVersions [v1beta1 v1beta2], so the CreateReplace
    # patch is rejected and every retry (upgrade and rollback alike) bounced the
    # controller pod. Group snapshots are unused here (0 objects). Revisit with a
    # storedVersions storage migration if these CRDs ever need chart management.
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  values:
    resources:
      limits:
        memory: 512Mi  # was 8Gi!
      requests:
        memory: 256Mi