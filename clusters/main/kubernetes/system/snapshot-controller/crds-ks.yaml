---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller-crds
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/system/snapshot-controller/crds
  # CRDs are never pruned: deleting a CRD cascades to every custom resource of
  # that type. Removing a file here must not wipe cluster state.
  prune: false
  # force makes Flux win server-side-apply field ownership against Helm, so a
  # chart upgrade that re-applies the stale v1beta1-only CRDs gets corrected on
  # the next reconcile instead of silently disabling all CephFS snapshots.
  force: true
  dependsOn:
    - name: snapshot-controller
  sourceRef:
    kind: GitRepository
    name: cluster
