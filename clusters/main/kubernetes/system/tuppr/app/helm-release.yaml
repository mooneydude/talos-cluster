---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  interval: 30m
  chart:
    spec:
      chart: tuppr
      version: 0.5.14
      sourceRef:
        kind: HelmRepository
        name: home-operations
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controller:
      logLevel: info
      leaderElection:
        enabled: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
