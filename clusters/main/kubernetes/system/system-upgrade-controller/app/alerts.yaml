---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: system-upgrade-controller
  namespace: system-upgrade
spec:
  groups:
    - name: system-upgrade
      rules:
        - alert: SystemUpgradeJobFailed
          expr: kube_job_status_failed{namespace="system-upgrade"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "System upgrade job {{ $labels.job_name }} failed"
            description: "A system-upgrade Plan job has failed. Check the job events and logs before retrying."
        - alert: SystemUpgradeControllerScaledToZero
          expr: kube_deployment_spec_replicas{namespace="system-upgrade",deployment="system-upgrade-controller"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "system-upgrade-controller is scaled to zero"
            description: "The controller is at 0 replicas, so Plans will not be applied. Restore replicas through Git."
