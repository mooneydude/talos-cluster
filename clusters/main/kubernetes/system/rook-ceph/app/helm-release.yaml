apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: rook-ceph
    namespace: rook-ceph
spec:
    interval: 5m
    releaseName: rook-ceph
    chart:
        spec:
            # renovate: registryUrl=https://charts.rook.io/release
            chart: rook-ceph
            version: v1.20.7
            sourceRef:
                kind: HelmRepository
                name: rook-ceph
                namespace: flux-system
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
        enableDiscoveryDaemon: true
        crds:
          enabled: true
        csi:
          csiAddons:
            enabled: false
          csiRBDProvisionerResource: |
            - name : csi-provisioner
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-resizer
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-attacher
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-snapshotter
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-rbdplugin
              resource:
                requests:
                  memory: 128Mi
                limits:
                  memory: 256Mi
          csiRBDPluginResource: |
            - name : driver-registrar
              resource:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 64Mi
            - name : csi-rbdplugin
              resource:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
          csiCephFSProvisionerResource: |
            - name : csi-provisioner
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-resizer
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-attacher
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-snapshotter
              resource:
                requests:
                  memory: 64Mi
                  cpu: 25m
                limits:
                  memory: 128Mi
            - name : csi-cephfsplugin
              resource:
                requests:
                  memory: 128Mi
                limits:
                  memory: 256Mi
          csiCephFSPluginResource: |
            - name : driver-registrar
              resource:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 64Mi
            - name : csi-cephfsplugin
              resource:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
        monitoring:
            enabled: true
        logCollector:
            enabled: true
            period: 24h
        imagePullSecrets: []
        logs:
          level: WARN
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 500m
                memory: 512Mi
                