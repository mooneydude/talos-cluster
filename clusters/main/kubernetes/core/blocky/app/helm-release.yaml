---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 15m
  chart:
    spec:
      chart: blocky
      version: 25.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ## set stopAll to "true" if you do not want to use blocky
    # and/or disable its service
    blocking:
      whitelist:
        - name: default-ads
          lists:
            - |
              viantinc.com
              *.viantinc.com
    global:
      stopAll: false
    service:
      dns:
        externalTrafficPolicy: Local
        loadBalancerIP: ${BLOCKY_IP}
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
    k8sgateway:
      # -- list of processed domains
      domains:
        - domain: "${DOMAIN_0}"
          # -- Optional configuration option for DNS01 challenge that will redirect all acme
          # challenge requests to external cloud domain (e.g. managed by cert-manager)
          # See: https://cert-manager.io/docs/configuration/acme/dns01/
          dnsChallenge:
            enabled: false
            domain: dns01.clouddns.com
        - domain: "${DOMAIN_1}"
          dnsChallenge:
            enabled: false
            domain: dns01.clouddns.com
      # - domain: "${DOMAIN_4}"
      #   dnsChallenge:
      #     enabled: false
      #     domain: dns01.clouddns.com

      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com

    # CANNOT be defined in above yaml section
    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console only
      type: postgresql

    configmap:
      dashboard:
        enabled: true
    secret:
      datasource:
        enabled: true

    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: blocky
          postgresqlDatabase: blocky
      valkey:
        enabled: true
        depconfig:
          password: "${BLOCKY_REDIS_PWD}"
        persistence:
          data:
            # Blocky's valkey is a disposable cross-replica cache, and blocky
            # sets redis.required: true (fatal at startup). emptyDir lets valkey
            # reschedule onto a healthy node in seconds instead of being pinned
            # to the node that holds an RWO PVC.
            type: emptyDir

    resources:
      limits:
        memory: 512Mi # was 4.8Gi
      requests:
        memory: 256Mi
