---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 15m
  chart:
    spec:
      chart: blocky
      version: 24.3.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    ## set stopAll to "true" if you do not want to use blocky
    # and/or disable its service
    blocking:
      whitelist:
        - name: default-ads
          lists:
            - |
              viantinc.com
              *.viantinc.com
    global:
      stopAll: false
    service:
      dns:
        externalTrafficPolicy: Local
        loadBalancerIP: ${BLOCKY_IP}
        type: LoadBalancer
    k8sgateway:
      # -- list of processed domains
      domains:
        - domain: "${DOMAIN_0}"
          # -- Optional configuration option for DNS01 challenge that will redirect all acme
          # challenge requests to external cloud domain (e.g. managed by cert-manager)
          # See: https://cert-manager.io/docs/configuration/acme/dns01/
          dnsChallenge:
            enabled: false
            domain: dns01.clouddns.com
        - domain: "${DOMAIN_1}"
          dnsChallenge:
            enabled: false
            domain: dns01.clouddns.com
      # - domain: "${DOMAIN_4}"
      #   dnsChallenge:
      #     enabled: false
      #     domain: dns01.clouddns.com

      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com

    # CANNOT be defined in above yaml section
    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console only
      type: postgresql

    configmap:
      dashboard:
        enabled: true
      datasource:
        enabled: true

    cnpg:
      main:
        enabled: true

    redis:
      enabled: true
      persistence:
        data:
          enabled: true
          mountPath: /bitnami/valkey
          # Blocky's redis is a disposable cross-replica cache, and the chart
          # sets redis.required: true (fatal at startup, see
          # templates/_blockyConfig.tpl upstream), so redis availability matters
          # for blocky restarts. With the default RWO ceph-nvme PVC the redis
          # pod is pinned to whichever node holds the volume: if that node dies
          # the pod stays Pending until the node returns. emptyDir lets redis
          # reschedule onto a healthy node in seconds, so the window where a
          # blocky restart would fail to connect stays inside blocky's own
          # 10 x 3s connectionAttempts/Cooldown retry budget.
          type: emptyDir

    resources:
      limits:
        memory: 512Mi # was 4.8Gi
      requests:
        memory: 256Mi
